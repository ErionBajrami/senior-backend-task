name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/quanos

# id-token: write enables cosign keyless signing via Sigstore Fulcio + Rekor.
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: build, sign, attest, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Re-run the canonical gates one more time. A green CI on the merged
      # commit is a good signal but not a guarantee — running here means
      # the released artifact is itself test-clean.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: pre-pull mongo:7
        run: docker pull mongo:7
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ──────────────────────────────────────────────────────────────────
      # Supply chain: keyless cosign sign + SBOM + cosign attest.
      # No private keys to rotate; signatures live in the Sigstore Rekor
      # transparency log and verify via the GitHub workflow OIDC identity.
      # ──────────────────────────────────────────────────────────────────
      - uses: sigstore/cosign-installer@v3

      - name: cosign sign image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: cosign attest sbom
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${tag}@${DIGEST}"
          done

      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom.spdx.json
