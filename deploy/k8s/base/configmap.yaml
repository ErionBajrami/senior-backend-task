apiVersion: v1
kind: ConfigMap
metadata:
  name: quanos-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '3000'
  OPS_PORT: '3001'
  MONGO_DB_NAME: quanos
  MONGO_TIMEOUT_MS: '5000'
  JWT_TTL_SECONDS: '3600'
  JWT_ISSUER: quanos
  JWT_AUDIENCE: quanos-admin
  RATE_LIMIT_MAX: '100'
  RATE_LIMIT_TIME_WINDOW: 1 minute
  CORS_ORIGINS: ''
  REQUEST_ID_HEADER: x-request-id
